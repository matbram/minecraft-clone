<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Clone</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      /* Crosshair */
      #crosshair {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 18px; height: 18px; pointer-events: none; opacity: 0.8;
      }
      #crosshair::before, #crosshair::after {
        content: ""; position: absolute; background: #fff;
        box-shadow: 0 0 1px rgba(0,0,0,0.6);
      }
      #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
      #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

      /* Pause / start menu overlay (Phase 11a) — shown whenever pointer unlocked */
      #menu {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.6); z-index: 60; user-select: none;
      }
      .menu-panel {
        background: #1a2733; border: 1px solid #34506a; border-radius: 12px;
        padding: 22px 26px; width: 380px; max-width: 90vw;
        font: 14px/1.4 system-ui, sans-serif; color: #dce9f7;
        max-height: 92vh; overflow-y: auto;
      }
      .menu-title { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 16px; }
      .menu-btn {
        display: block; width: 100%; padding: 10px; margin-bottom: 8px;
        font: 600 16px/1 system-ui, sans-serif; color: #0c1620;
        background: #6fc36f; border: none; border-radius: 8px; cursor: pointer;
      }
      .menu-btn:hover { background: #82d682; }
      .menu-section {
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
        color: #8fb0cc; margin: 14px 0 8px; border-bottom: 1px solid #2a3f54; padding-bottom: 4px;
      }
      .menu-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
      .menu-row > span:first-child { flex: 0 0 118px; color: #c4d6ea; }
      .menu-row select, .menu-row input[type="range"] { flex: 1; min-width: 0; }
      .menu-row select {
        background: #0f1b26; color: #dce9f7; border: 1px solid #34506a;
        border-radius: 6px; padding: 4px 6px;
      }
      .menu-row input[type="range"] { accent-color: #6fc36f; }
      .menu-val {
        flex: 0 0 42px; text-align: right; color: #9fc0dc; font-variant-numeric: tabular-nums;
      }
      .menu-check { cursor: pointer; }
      .menu-check input { margin-left: auto; width: 16px; height: 16px; accent-color: #6fc36f; }
      .menu-controls {
        margin-top: 8px; font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; color: #9fb6cc;
      }

      /* Debug HUD */
      #hud {
        position: fixed; left: 8px; top: 8px;
        font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8f0ff;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8); white-space: pre; pointer-events: none;
        user-select: none;
      }

      /* Hotbar */
      #hotbar {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
        display: flex; gap: 4px; pointer-events: none; user-select: none;
      }
      .hotbar-slot {
        position: relative; width: 48px; height: 48px;
        background: rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.25);
        border-radius: 4px; display: flex; align-items: center; justify-content: center;
      }
      .hotbar-slot.active { border-color: #fff; background: rgba(255,255,255,0.18); }
      .hotbar-slot canvas { image-rendering: pixelated; width: 40px; height: 40px; }
      .hotbar-num {
        position: absolute; top: 1px; left: 3px; font: 10px/1 ui-monospace, monospace;
        color: #fff; text-shadow: 0 1px 1px #000;
      }

      /* Inventory overlay */
      #inventory {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.55); z-index: 50; user-select: none;
      }
      .inv-panel {
        background: #1a2733; border: 1px solid #34506a; border-radius: 12px;
        padding: 18px 20px; max-width: 460px;
      }
      .inv-title { color: #dce9f7; font: 13px/1.4 system-ui, sans-serif; margin-bottom: 12px; }
      .inv-grid { display: grid; grid-template-columns: repeat(6, 56px); gap: 6px; }
      .inv-cell {
        width: 56px; height: 56px; background: rgba(0,0,0,0.3);
        border: 2px solid rgba(255,255,255,0.18); border-radius: 4px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      .inv-cell:hover { border-color: #fff; background: rgba(255,255,255,0.16); }
      .inv-cell canvas { image-rendering: pixelated; width: 48px; height: 48px; }

      /* Survival HUD (Phase 11b) — hearts/hunger above the hotbar, air when diving */
      #survival-hud {
        position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%);
        display: none; flex-direction: column; align-items: center; gap: 3px;
        pointer-events: none; user-select: none; z-index: 30;
      }
      .sv-row { display: flex; gap: 1px; }
      .sv-stats { display: flex; gap: 44px; }
      .sv-row canvas { width: 18px; height: 18px; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.7)); }

      /* Death flash (Phase 11b) */
      #death-overlay {
        position: fixed; inset: 0; pointer-events: none; user-select: none; z-index: 70;
        opacity: 0; transition: opacity 0.18s ease;
        background: radial-gradient(ellipse at center, rgba(130,0,0,0.25), rgba(80,0,0,0.8));
      }
      #death-overlay.active { opacity: 1; }

      /* Underwater tint (Phase 5) — fades in while the eye is submerged */
      #underwater-tint {
        position: fixed; inset: 0; pointer-events: none; user-select: none;
        z-index: 40; opacity: 0; transition: opacity 0.25s ease;
        background:
          radial-gradient(ellipse at center, rgba(42,94,122,0.25), rgba(20,54,80,0.7));
      }
      #underwater-tint.active { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="hud"></div>
    <div id="hotbar"></div>
    <div id="survival-hud"></div>
    <div id="inventory"></div>
    <div id="menu"></div>
    <div id="death-overlay"></div>
    <div id="underwater-tint"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
